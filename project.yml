name: MetalMesh
options:
  bundleIdPrefix: com.gzonelee
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # 개인 개발 팀. 다른 팀으로 바꾸려면 여기만 수정 후 `xcodegen generate`
    DEVELOPMENT_TEAM: WD3LPJ2STX

targets:
  # 메시 처리 라이브러리. 로더·메시렛 빌더·수학은 핫 루프가 많아 Debug에서도 -O로 빌드한다
  # (-Onone은 50배 느림: bunny 클러스터링 2.1s vs 38ms). 앱 본체는 -Onone으로 디버깅 가능.
  MeshCore:
    type: framework
    supportedDestinations: [iOS, macOS]
    sources:
      - path: MeshCore
        excludes:
          - "include/**"
      - path: MeshCore/include/MeshCore.h
        headerVisibility: public
      - path: MeshCore/include/ShaderTypes.h
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gzonelee.metalmesh.meshcore
        PRODUCT_NAME: MeshCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        ENABLE_TESTABILITY: YES

  MetalMesh:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: MetalMesh
        excludes:
          - "Resources/Samples/**"   # 아래 폴더 참조로만 포함
      - path: MetalMesh/Resources/Samples
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - target: MeshCore
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gzonelee.metalmesh
        PRODUCT_NAME: MetalMesh
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MetalMesh
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # iOS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # Metal 셰이더가 MeshCore의 ShaderTypes.h를 include
        MTL_HEADER_SEARCH_PATHS: "$(SRCROOT)/MeshCore/include"
        # 멀티플랫폼 타깃: 임베드된 프레임워크 위치가 플랫폼마다 다르다
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) @executable_path/Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) @executable_path/Frameworks"
        # Metal
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        MTL_LANGUAGE_REVISION: Metal30
        # macOS 앱 샌드박스 + 파일 열기
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        Release:
          MTL_ENABLE_DEBUG_INFO: NO
    entitlements:
      path: MetalMesh/MetalMesh.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true

  MetalMeshTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: MetalMesh
      - target: MeshCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gzonelee.metalmesh.tests
        GENERATE_INFOPLIST_FILE: YES
        # 멀티플랫폼 타깃: macOS 번들은 실행 파일이 Contents/MacOS 아래에 있다
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/MetalMesh.app/Contents/MacOS/MetalMesh"
        "TEST_HOST[sdk=iphoneos*]": "$(BUILT_PRODUCTS_DIR)/MetalMesh.app/MetalMesh"
        "TEST_HOST[sdk=iphonesimulator*]": "$(BUILT_PRODUCTS_DIR)/MetalMesh.app/MetalMesh"
        BUNDLE_LOADER: "$(TEST_HOST)"
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=iphoneos*]": "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
        "LD_RUNPATH_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"

schemes:
  MetalMesh:
    build:
      targets:
        MetalMesh: all
        MetalMeshTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MetalMeshTests
      gatherCoverageData: false
