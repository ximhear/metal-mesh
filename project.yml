name: MetalMesh
options:
  bundleIdPrefix: com.gzonelee
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # 명령줄 빌드 검증용. Xcode에서 실기기 배포 시 Signing 탭에서 팀 지정
    CODE_SIGN_STYLE: Automatic

targets:
  MetalMesh:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: MetalMesh
        excludes:
          - "Resources/Samples/**/*.md"
      - path: MetalMesh/Resources/Samples
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gzonelee.metalmesh
        PRODUCT_NAME: MetalMesh
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MetalMesh
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        # iOS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        # Metal
        MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        MTL_LANGUAGE_REVISION: Metal30
        # macOS 앱 샌드박스 + 파일 열기
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
        Release:
          MTL_ENABLE_DEBUG_INFO: NO
    entitlements:
      path: MetalMesh/MetalMesh.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true

  MetalMeshTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: MetalMesh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gzonelee.metalmesh.tests
        GENERATE_INFOPLIST_FILE: YES
        # 멀티플랫폼 타깃: macOS 번들은 실행 파일이 Contents/MacOS 아래에 있다
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/MetalMesh.app/Contents/MacOS/MetalMesh"
        "TEST_HOST[sdk=iphoneos*]": "$(BUILT_PRODUCTS_DIR)/MetalMesh.app/MetalMesh"
        "TEST_HOST[sdk=iphonesimulator*]": "$(BUILT_PRODUCTS_DIR)/MetalMesh.app/MetalMesh"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MetalMesh:
    build:
      targets:
        MetalMesh: all
        MetalMeshTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MetalMeshTests
      gatherCoverageData: false
